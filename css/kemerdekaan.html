<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Hari Kemerdekaan Indonesia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f5f5f5;
            overflow-x: hidden;
            perspective: 1000px;
        }

        .container {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1;
        }

        .title {
            font-size: 3.5rem;
            font-weight: bold;
            color: #e70000;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 2s infinite, float 3s ease-in-out infinite;
        }

        .subtitle {
            font-size: 1.8rem;
            color: #000;
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 2s ease-in;
        }

        .year {
            font-size: 5rem;
            font-weight: bold;
            color: #e70000;
            margin: 20px 0;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            animation: zoomInOut 4s infinite;
        }

        .flag-container {
            position: relative;
            width: 300px;
            height: 200px;
            margin: 30px auto;
            transform-style: preserve-3d;
            animation: wave 5s ease-in-out infinite;
        }

        .flag {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #e70000 50%, #fff 50%);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }

        .flag-pole {
            position: absolute;
            left: -20px;
            top: 0;
            width: 10px;
            height: 250px;
            background: linear-gradient(to right, #8B4513, #A0522D);
            transform: rotateZ(-5deg);
            z-index: -1;
        }

        .fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .firework {
            position: absolute;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            box-shadow: 0 0 10px 5px rgba(255, 255, 255, 0.8);
            animation: explode 2s ease-out infinite;
            opacity: 0;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0;
            z-index: 999;
            animation: confettiFall 5s linear infinite;
        }

        .merdeka-text {
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 30px;
            background: linear-gradient(45deg, #e70000, #fff, #e70000);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 3s infinite, rotate 10s linear infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomInOut {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes wave {
            0%, 100% { transform: rotateY(0deg) rotateZ(0deg); }
            25% { transform: rotateY(10deg) rotateZ(2deg); }
            50% { transform: rotateY(0deg) rotateZ(-2deg); }
            75% { transform: rotateY(-10deg) rotateZ(2deg); }
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
        }

        @keyframes confettiFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        @keyframes shine {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            .subtitle {
                font-size: 1.3rem;
            }
            .year {
                font-size: 3.5rem;
            }
            .flag-container {
                width: 200px;
                height: 133px;
            }
            .flag-pole {
                height: 180px;
            }
            .merdeka-text {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">SELAMAT HARI KEMERDEKAAN</h1>
        <h2 class="subtitle">Republik Indonesia</h2>
        <div class="year">17 Agustus 1945</div>
        
        <div class="flag-container">
            <div class="flag"></div>
            <div class="flag-pole"></div>
        </div>
        
        <div class="merdeka-text">MERDEKA!</div>
    </div>

    <div class="fireworks" id="fireworks"></div>

999999999999999999999999999999999999`                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           <script>
        // Animasi kembang api
        function createFireworks() {
            const fireworksContainer = document.getElementById('fireworks');
            const colors = ['#ff0000', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff00ff', '#ffffff'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.className = 'firework';
                    
                    // Posisi acak di layar
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight * 0.5;
                    
                    // Warna acak
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    
                    firework.style.left = `${x}px`;
                    firework.style.top = `${y}px`;
                    firework.style.backgroundColor = color;
                    
                    // Arah ledakan acak
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 50 + Math.random() * 100;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance;
                    
                    firework.style.setProperty('--tx', `${tx}px`);
                    firework.style.setProperty('--ty', `${ty}px`);
                    
                    // Delay animasi acak
                    firework.style.animationDelay = `${Math.random() * 2}s`;
                    
                    fireworksContainer.appendChild(firework);
                    
                    // Hapus elemen setelah animasi selesai
                    setTimeout(() => {
                        firework.remove();
                    }, 2000);
                }, i * 500);
            }
        }
        
        // Animasi confetti
        function createConfetti() {
            const colors = ['#e70000', '#ffffff', '#ffcc00', '#00a2e8', '#22b14c', '#ff7f27'];
            
            for (let i = 0; i < 150; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    
                    // Posisi awal acak di bagian atas layar
                    const x = Math.random() * window.innerWidth;
                    
                    // Ukuran acak
                    const size = 5 + Math.random() * 10;
                    
                    // Warna acak
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    
                    // Bentuk acak (persegi atau lingkaran)
                    const shape = Math.random() > 0.5 ? '50%' : '0';
                    
                    confetti.style.left = `${x}px`;
                    confetti.style.width = `${size}px`;
                    confetti.style.height = `${size}px`;
                    confetti.style.backgroundColor = color;
                    confetti.style.borderRadius = shape;
                    
                    // Durasi dan delay animasi acak
                    const duration = 3 + Math.random() * 7;
                    const delay = Math.random() * 5;
                    
                    confetti.style.animationDuration = `${duration}s`;
                    confetti.style.animationDelay = `${delay}s`;
                    
                    document.body.appendChild(confetti);
                    
                    // Hapus elemen setelah animasi selesai
                    setTimeout(() => {
                        confetti.remove();
                    }, duration * 1000);
                }, i * 200);
            }
        }
        
        // Efek ketik untuk subtitle
        function typeWriter() {
            const subtitle = document.querySelector('.subtitle');
            const text = "Republik Indonesia";
            let i = 0;
            
            function type() {
                if (i < text.length) {
                    subtitle.textContent += text.charAt(i);
                    i++;
                    setTimeout(type, 100);
                }
            }
            
            // Kosongkan teks terlebih dahulu
            subtitle.textContent = "";
            setTimeout(type, 1000);
        }
        
        // Jalankan semua animasi setelah halaman dimuat
        window.addEventListener('load', () => {
            typeWriter();
            createFireworks();
            createConfetti();
            
            // Buat kembang api baru setiap beberapa detik
            setInterval(createFireworks, 5000);
            
            // Buat confetti baru setiap beberapa detik
            setInterval(createConfetti, 8000);
        });
    </script>
</body>
</html>
