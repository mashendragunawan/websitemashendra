<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Password</title>
</head>
<body>
    <div class="zoom-container">
        <div class="container">
            <h2>Buat Password Baru</h2>
            <form id="passwordForm">
                <input type="password"  id="password" class="password-input" placeholder="Masukan Password" autocomplete="off">
                <button type="button" id="togglePassword" class="toggle-password">
                    <i class="fas fa-eye"></i>
                </button>
                <div class="stargh">
                    <div id="satrtfie" class="stargh"></div>
                    <div class="requerd">
                        <div class="requaimt">
                            <i id="leghtIcon"></i>
                            <span>Minimal 8 Karater</span>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background:linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
        padding: 20px;
        overflow: hidden;
    }
    .zoom-container{
        animation: zoomIn 0.8s ease-out forwards;
        transform-origin: center;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    @keyframes zoomIn{
        0%{
            transform: scale(0.5);
            opacity: 0;
        }
        100%{
            transform: scale(1);
            opacity: 1;
        }
    }
    .container{
        width: 100%;
        max-width:400px;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        padding: 30px;
    }
</style>
</html>
